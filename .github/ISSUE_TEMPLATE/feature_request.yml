name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: sia
    attributes:
      label: Does the hub send an event for it?
      description: If you know the SIA code, or can attach a debug log, say so. The plugin can only act on what the hub reports.
